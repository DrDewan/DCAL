name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  annotation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install annotation tools
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic export
        run: python -m dcal_annotations validate-export examples/label-studio-export.valid.json
      - name: Verify deterministic normalization
        run: |
          python -m dcal_annotations normalize-export examples/label-studio-export.valid.json --output /tmp/gold-one.jsonl
          python -m dcal_annotations normalize-export examples/label-studio-export.valid.json --output /tmp/gold-two.jsonl
          cmp /tmp/gold-one.jsonl /tmp/gold-two.jsonl
      - name: Validate project bootstrap payload
        run: python scripts/bootstrap_label_studio_project.py --dry-run > /tmp/label-studio-project.json
      - name: Validate ingestion CLI
        run: python -m dcal_ingestion --help
      - name: Validate workbench CLI
        run: python -m dcal_workbench --help

  hosted-workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install hosted workbench dependencies
        run: npm ci
      - name: Run hosted contract tests
        run: npm test
      - name: Typecheck hosted workbench
        run: npm run typecheck
      - name: Check browser client JavaScript
        run: |
          node --check public/app.js
          node --check public/ux-v2.js
      - name: Build hosted workbench
        run: npm run build
        env:
          # Build-time placeholders only. Real values live in Vercel project
          # settings and are never committed. These satisfy lib/env.ts shape
          # validation during static analysis; no request is made to Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_real_key
          SUPABASE_SECRET_KEY: sb_secret_ci_only_not_a_real_key
          DCAL_WORKBENCH_INGEST_TOKEN: ci-only-not-a-real-workbench-ingest-token

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose including ingestion profile
        env:
          DCAL_WORKBENCH_INGEST_TOKEN: ci-only-not-a-real-workbench-secret
          LABEL_STUDIO_USERNAME: ci@example.invalid
          LABEL_STUDIO_PASSWORD: ci-only-not-a-real-password
          POSTGRES_PASSWORD: ci-only-not-a-real-database-password
        run: docker compose --profile ingestion config --quiet
      - name: Build ingestion image
        run: docker build --tag dcal-ingestion:ci .
