[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dcal-annotation-tools"
version = "0.2.0"
description = "Google Drive ingestion and annotation data tools for DCAL"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.179,<3",
  "google-auth>=2.40,<3",
  "Pillow==12.3.0",
  "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
oauth = ["google-auth-oauthlib>=1.2,<2"]

[project.scripts]
dcal-annotations = "dcal_annotations.cli:main"
dcal-ingest = "dcal_ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
