name: dcal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcal_labelstudio}
      POSTGRES_USER: ${POSTGRES_USER:-dcal_labelstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  label-studio:
    image: ${LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB:-dcal_labelstudio}
      POSTGRE_USER: ${POSTGRES_USER:-dcal_labelstudio}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRE_PORT: "5432"
      POSTGRE_HOST: db
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:?Set LABEL_STUDIO_USERNAME in .env}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?Set LABEL_STUDIO_PASSWORD in .env}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      SSRF_PROTECTION_ENABLED: "true"
      COLLECT_ANALYTICS: "False"
      JSON_LOG: "1"
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: ${LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED:-false}
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    command: ["label-studio", "start", "--no-browser"]
    volumes:
      - label_studio_data:/label-studio/data
      - ${DCAL_LOCAL_FILES_DIR:-./data/images}:/label-studio/files:ro

volumes:
  label_studio_data:
  postgres_data:
