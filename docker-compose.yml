name: dcal

services:
  db:
    profiles: ["legacy-label-studio"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcal_labelstudio}
      POSTGRES_USER: ${POSTGRES_USER:-dcal_labelstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  label-studio:
    profiles: ["legacy-label-studio"]
    image: ${LABEL_STUDIO_IMAGE:-heartexlabs/label-studio:1.23.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB:-dcal_labelstudio}
      POSTGRE_USER: ${POSTGRES_USER:-dcal_labelstudio}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRE_PORT: "5432"
      POSTGRE_HOST: db
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:?Set LABEL_STUDIO_USERNAME in .env}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?Set LABEL_STUDIO_PASSWORD in .env}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      SSRF_PROTECTION_ENABLED: "true"
      COLLECT_ANALYTICS: "False"
      JSON_LOG: "1"
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: ${LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED:-true}
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    command: ["label-studio", "start", "--no-browser"]
    volumes:
      - label_studio_data:/label-studio/data
      - dcal_page_cache:/label-studio/files:ro

  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: dcal-workbench:local
    restart: unless-stopped
    ports:
      - "${DCAL_WORKBENCH_BIND_IP:-127.0.0.1}:${DCAL_WORKBENCH_PORT:-8090}:8090"
    environment:
      DCAL_WORKBENCH_HOST: 0.0.0.0
      DCAL_WORKBENCH_PORT: 8090
      DCAL_WORKBENCH_DATABASE: /app/data/state/workbench.sqlite3
      DCAL_PAGE_CACHE_ROOT: /app/data/images
      DCAL_WORKBENCH_INGEST_TOKEN: ${DCAL_WORKBENCH_INGEST_TOKEN:?Set DCAL_WORKBENCH_INGEST_TOKEN in .env}
    command: ["workbench"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - dcal_page_cache:/app/data/images
      - dcal_workbench_state:/app/data/state

  dcal-ingest:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: Dockerfile
    image: dcal-ingestion:local
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-drive-credentials.json
      GOOGLE_DELEGATED_SUBJECT: ${GOOGLE_DELEGATED_SUBJECT:-}
      DCAL_DRIVE_ROOT_FOLDER_ID: ${DCAL_DRIVE_ROOT_FOLDER_ID:-}
      DCAL_GROUP_HMAC_KEY: ${DCAL_GROUP_HMAC_KEY:-}
      DCAL_ANNOTATION_BACKEND: workbench
      DCAL_WORKBENCH_URL: ${DCAL_WORKBENCH_URL:-http://workbench:8090}
      DCAL_WORKBENCH_INGEST_TOKEN: ${DCAL_WORKBENCH_INGEST_TOKEN:?Set DCAL_WORKBENCH_INGEST_TOKEN in .env}
      DCAL_PAGE_CACHE_ROOT: /app/data/images
      DCAL_INGESTION_LEDGER: /app/data/state/ingestion.sqlite3
    command: ["watch", "--interval", "${DCAL_INGESTION_INTERVAL_SECONDS:-60}"]
    volumes:
      - ${DCAL_GOOGLE_CREDENTIALS_FILE:-./secrets/google-drive-credentials.json}:/run/secrets/google-drive-credentials.json:ro
      - dcal_page_cache:/app/data/images
      - dcal_ingestion_state:/app/data/state

volumes:
  dcal_ingestion_state:
  dcal_page_cache:
  dcal_workbench_state:
  label_studio_data:
  postgres_data:
